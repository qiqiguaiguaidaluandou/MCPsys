user nginx;
worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    upstream gateway_upstream {
        server gateway:8080;
        # docker compose --scale gateway=N will register additional addrs via DNS
        # nginx resolves "gateway" to all replicas at startup; for dynamic scaling use
        # nginx-plus or sidecar.
    }

    upstream control_plane_upstream {
        server control-plane:8000;
    }

    upstream web_upstream {
        server web:80;
    }

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 10m;

        # docker 内嵌 DNS，供下面用变量做运行时上游解析
        resolver 127.0.0.11 valid=10s ipv6=off;

        # MCP 服务文件下载（如 aftersales-search 的 FQC 报告）。
        # 用 set+变量 让 nginx 在"请求时"解析上游：即使该 MCP 服务未启动，
        # nginx 也能正常启动（仅请求时返回 502），不拖垮整个入口。
        # 新增带文件下载的服务时，按此 location 复制一份，换 slug 与上游名即可。
        location /mcp-files/aftersales-search/ {
            set $afs_dl http://mcp-aftersales-search:8000;
            proxy_pass $afs_dl;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # MCP traffic → gateway
        location /mcp/ {
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;          # streaming responses
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Gateway healthz (for ops)
        location /gw/healthz {
            proxy_pass http://gateway_upstream/healthz;
        }

        # Control Plane API + healthz
        location /api/ {
            proxy_pass http://control_plane_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /healthz {
            proxy_pass http://control_plane_upstream/healthz;
        }

        # SPA 静态前端（必须放最后，以免抢前面更具体的 location）
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
