# MCP 服务清单（单一信息源）。compose 片段与控制面注册都从这里派生。
# new_mcp_service.sh 会把 __SLUG__ / __DISPLAY_NAME__ 占位符替换好。
slug: __SLUG__                   # 唯一，小写连字符，2-64 字符
display_name: __DISPLAY_NAME__
description: TODO 一句话描述这个服务
owner_team: platform
tags: []
port: 8000                       # 容器内监听端口（模板统一 8000，一般不用改）
path: /mcp                       # MCP streamable-http RPC 路径
rate_limit_qps: null             # null=不限；上线建议配一个值（整数）
required_env:                    # 对接公司接口需要的环境变量"名字"（值放同目录 .env）
  # - UPSTREAM_BASE
  # - UPSTREAM_TOKEN
