# MCP 服务编排（与 compose.yaml 合并使用，同属 project "mcpsys"）。
#
#   docker compose -f compose.yaml -f compose.mcp.yaml up -d
#
# 同一 project ⇒ 共享默认网络 mcpsys_default ⇒ gateway 可用服务名 mcp-<slug> 直连。
# MCP 服务不暴露宿主端口，对外只有 nginx:8088。
#
# 容器自注册：每个 MCP 服务启动时由 entrypoint 跑 register.py，用 REGISTRAR_* 账号
# 登录 control-plane 把自己 upsert 到后台 —— 重启即更新，无需任何脚本/按钮。
#
# 阶段 2 起本文件由 scripts/sync_mcp_services.py --gen-compose 生成。
name: mcpsys

x-mcp-env: &mcp-env
  MCPSYS_URL: http://control-plane:8000
  REGISTRAR_USER: ${REGISTRAR_USER}
  REGISTRAR_PASSWORD: ${REGISTRAR_PASSWORD}

services:
  # 由 ex/mcp 迁入：按 SN 查 CRM 售后 / MES 工序 / 设备档案 / FQC 报告。
  # 需先 cp mcp-services/aftersales-search/.env.example .env 并填密钥（否则 env_file 缺失会导致 up 失败）。
  mcp-aftersales-search:
    build: ./mcp-services/aftersales-search
    restart: unless-stopped
    environment:
      <<: *mcp-env
    env_file: ./mcp-services/aftersales-search/.env
    volumes:
      - aftersales-fqc-reports:/data/fqc_reports
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  aftersales-fqc-reports:
