[project]
name = "control-plane"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcpsys-shared",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "cryptography>=42",
    "redis>=5.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psycopg[binary]>=3.1",
    "email-validator>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "testcontainers[postgres,redis]>=4.5",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
